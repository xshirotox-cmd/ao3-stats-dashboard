<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<title>Pridento Stats</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M8 22l5-6 4 3 7-9' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>/* Pridento Stats — palette and chrome follow the dataviz reference instance. */
:root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f2f1ed;
  --surface-3: #e9e8e3;
  --ink: #0b0b0b;
  --ink-2: #52514e;
  --muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11, 11, 11, 0.10);
  --border-strong: rgba(11, 11, 11, 0.18);
  --accent: #2a78d6;
  --accent-ink: #1c5cab;
  --accent-wash: rgba(42, 120, 214, 0.10);
  --good-text: #006300;
  --shadow: 0 1px 2px rgba(11, 11, 11, 0.05), 0 4px 16px rgba(11, 11, 11, 0.04);
  --tooltip-shadow: 0 6px 24px rgba(11, 11, 11, 0.14);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
  --st-good: #0ca30c; --st-warning: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
  --radius: 14px;
  --radius-sm: 9px;
  --sidebar: 232px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835;
    --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.18);
    --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, 0.16);
    --good-text: #0ca30c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
    --tooltip-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321; --surface-3: #2c2c2a;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835;
  --border: rgba(255, 255, 255, 0.10); --border-strong: rgba(255, 255, 255, 0.18);
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-wash: rgba(57, 135, 229, 0.16);
  --good-text: #0ca30c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  --tooltip-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { min-height: 100vh; }
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar);
  display: flex; flex-direction: column; gap: 18px; padding: 20px 14px;
  border-right: 1px solid var(--border); background: var(--page); z-index: 5;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px; color: var(--ink); }
.brand:hover { text-decoration: none; }
.brand-mark { width: 32px; height: 32px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; }
.brand-text b { font-size: 15px; }
.brand-text small { color: var(--muted); font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px;
  color: var(--ink-2); font-weight: 500;
}
.nav a:hover { background: var(--surface-2); text-decoration: none; color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-wash); color: var(--accent-ink); }
.nav svg, .tabbar svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
.freshness { padding: 10px; border-radius: 10px; background: var(--surface-2); color: var(--ink-2); font-size: 12px; line-height: 1.4; }
.freshness b { color: var(--ink); font-weight: 600; }
.theme-toggle {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 9px; background: transparent; color: var(--ink-2); font-size: 12.5px;
}
.theme-toggle:hover { background: var(--surface-2); color: var(--ink); }
.theme-toggle svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }

.main { margin-left: var(--sidebar); min-width: 0; padding: 0 32px 48px; }
.topbar {
  position: sticky; top: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; padding: 18px 0 14px; margin-bottom: 6px;
  background: color-mix(in srgb, var(--page) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px);
}
.topbar-title { min-width: 0; }
.topbar h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; line-height: 1.2; overflow-wrap: anywhere; }
.topbar p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.topbar-tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.view { display: flex; flex-direction: column; gap: 18px; outline: none; }
.foot { margin-top: 32px; color: var(--muted); font-size: 12px; }

.tabbar { display: none; }

/* ---------- controls ---------- */
.seg {
  display: inline-flex; padding: 3px; gap: 2px; border-radius: 10px;
  background: var(--surface-2); border: 1px solid var(--border);
}
.seg button {
  border: 0; background: transparent; padding: 5px 11px; border-radius: 7px;
  color: var(--ink-2); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.toolbar { display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; }
.toolbar .label { color: var(--muted); font-size: 12px; font-weight: 500; }
.toolbar .seg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.toolbar .seg::-webkit-scrollbar { display: none; }
.field {
  display: inline-flex; align-items: center; gap: 8px; padding: 0 10px; height: 34px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface);
}
.field input, .field select { border: 0; background: transparent; outline: none; height: 32px; min-width: 0; }
.field input[type="search"] { width: 200px; }
.field input[type="number"] { width: 52px; }
.field svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 2; flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink-2);
  font-size: 13px; font-weight: 500;
}
.btn:hover { color: var(--ink); background: var(--surface-2); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn { white-space: nowrap; }
.btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn:disabled { opacity: .45; cursor: default; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent-ink); font-weight: 500; }

/* ---------- cards ---------- */
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 18px 20px; min-width: 0;
}
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.card-head h2 { margin: 0; font-size: 15px; font-weight: 600; }
.card-head p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.card-head .actions { display: flex; gap: 6px; flex: none; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 18px; }
.grid-2.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.section-title { margin: 10px 0 -4px; font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.note { color: var(--muted); font-size: 12.5px; margin: 10px 0 0; }
.empty { padding: 36px 12px; text-align: center; color: var(--muted); }

/* ---------- KPI tiles ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
.kpi {
  text-align: left; display: flex; flex-direction: column; gap: 4px; padding: 14px 16px 12px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); min-width: 0; position: relative;
}
button.kpi:hover { border-color: var(--border-strong); }
.kpi[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
.kpi .k-label { color: var(--ink-2); font-size: 12.5px; font-weight: 500; }
.kpi .k-value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.15; }
.kpi .k-delta { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .k-spark { height: 30px; margin-top: 4px; }
.up { color: var(--good-text); font-weight: 600; }
.flat { color: var(--muted); }

/* ---------- banner ---------- */
.banner {
  display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; margin-bottom: 16px;
  border-radius: 12px; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow);
}
.banner .b-text { flex: 1; min-width: 0; }
.banner b { display: block; font-size: 13.5px; }
.banner span { color: var(--ink-2); font-size: 13px; }

/* ---------- status chips ---------- */
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.status i {
  width: 16px; height: 16px; border-radius: 50%; display: inline-grid; place-items: center;
  font-style: normal; font-size: 10px; font-weight: 800; color: #fff; flex: none;
}
.status.good i { background: var(--st-good); }
.status.warning i { background: var(--st-warning); color: #0b0b0b; }
.status.serious i { background: var(--st-serious); color: #0b0b0b; }
.status.critical i { background: var(--st-critical); }
.status.neutral i { background: var(--muted); }

/* ---------- charts ---------- */
.chart { position: relative; width: 100%; outline: none; touch-action: pan-y; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.chart .grid line { stroke: var(--grid); stroke-width: 1; shape-rendering: crispEdges; }
.chart .baseline { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .axis-title { fill: var(--muted); font-size: 11px; }
.chart .crosshair { stroke: var(--ink-2); stroke-width: 1; opacity: .55; shape-rendering: crispEdges; pointer-events: none; }
.chart .ref { stroke: var(--axis); stroke-width: 1.5; }
.chart .marker { fill: var(--ink-2); }
.chart .marker-line { stroke: var(--axis); stroke-width: 1; shape-rendering: crispEdges; }
.chart .end-label { fill: var(--ink-2); font-size: 11.5px; font-weight: 500; }
.chart .bar { transition: opacity .12s; }
.chart .bar.est { opacity: .45; }
.chart .bar.hot { filter: brightness(1.15); }
.chart .dot-ring { fill: none; stroke: var(--surface); stroke-width: 2; }
.chart-wrap { position: relative; }
.chart-wrap.dim { opacity: .55; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; }
.legend-item {
  display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2);
  border: 0; background: none; padding: 2px 0; max-width: 260px;
}
.legend-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.legend-item:hover { color: var(--ink); }
.key-line { width: 14px; height: 2.5px; border-radius: 2px; flex: none; }
.key-rect { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.key-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }

.tooltip {
  position: fixed; z-index: 50; pointer-events: none; min-width: 150px; max-width: 300px;
  padding: 10px 12px; border-radius: 10px; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border-strong); box-shadow: var(--tooltip-shadow); font-size: 12.5px;
}
.tooltip .tt-head { color: var(--muted); font-size: 11.5px; font-weight: 500; margin-bottom: 6px; }
.tooltip .tt-row { display: flex; align-items: center; gap: 8px; line-height: 1.6; }
.tooltip .tt-row b { font-variant-numeric: tabular-nums; font-weight: 650; }
.tooltip .tt-row span { color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tooltip .tt-note { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); color: var(--ink-2); font-size: 11.5px; }

/* ---------- tables ---------- */
.table-scroll { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th {
  text-align: right; font-weight: 500; color: var(--muted); font-size: 12px; padding: 8px 10px;
  border-bottom: 1px solid var(--border); white-space: nowrap; user-select: none;
}
table.data th:first-child, table.data td:first-child { text-align: left; padding-left: 0; }
table.data th.sortable { cursor: pointer; }
table.data th.sortable:hover { color: var(--ink); }
table.data th[aria-sort] { color: var(--ink); }
table.data td { text-align: right; padding: 9px 10px; border-bottom: 1px solid var(--border); font-variant-numeric: tabular-nums; vertical-align: middle; }
table.data tr:last-child td { border-bottom: 0; }
table.data th.left, table.data td.left { text-align: left; }
table.data tbody tr.clickable { cursor: pointer; }
table.data tbody tr.clickable:hover td { background: var(--surface-2); }
table.data .t-title { display: block; font-weight: 550; color: var(--ink); max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.data .t-sub { display: block; color: var(--muted); font-size: 11.5px; font-weight: 400; }
table.data .sub { display: block; font-size: 11.5px; color: var(--muted); }
table.data td.spark { width: 120px; padding-top: 4px; padding-bottom: 4px; }
.pager { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; color: var(--muted); font-size: 12.5px; }

/* ---------- lists ---------- */
.rank { display: flex; flex-direction: column; gap: 2px; }
.rank-row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center;
  padding: 8px 8px; margin: 0 -8px; border-radius: 9px; border: 0; background: none; text-align: left;
}
.rank-row:hover { background: var(--surface-2); }
.rank-row .r-title { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank-row .r-val { font-variant-numeric: tabular-nums; font-weight: 600; }
.rank-row .r-val small { color: var(--muted); font-weight: 500; margin-left: 6px; }
.rank-row .r-bar { grid-column: 1 / -1; height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.rank-row .r-bar i { display: block; height: 100%; border-radius: 4px; background: var(--s1); }

/* ---------- work detail ---------- */
.crumbs { margin: -2px 0 -6px; font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-2); font-size: 12.5px; border: 1px solid transparent;
}
.chip.warn { border-color: var(--border-strong); }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.milestones td.rankcell { color: var(--muted); font-size: 11.5px; }
.notes-card blockquote { margin: 8px 0 0; color: var(--ink-2); line-height: 1.55; }

/* ---------- compare picker ---------- */
.picker { display: flex; flex-wrap: wrap; gap: 8px; }
.pick {
  display: inline-flex; align-items: center; gap: 8px; max-width: 280px; padding: 6px 12px 6px 10px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
  font-size: 13px; font-weight: 500;
}
.pick span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick:hover { border-color: var(--border-strong); color: var(--ink); }
.pick[aria-pressed="true"] { color: var(--ink); border-color: var(--border-strong); background: var(--surface-2); }
.pick:disabled { opacity: .45; cursor: not-allowed; }
.pick .swatch { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--axis); flex: none; }
.pick[aria-pressed="true"] .swatch { border: 0; }

/* ---------- status view ---------- */
.sources { display: flex; flex-direction: column; }
.source-row {
  display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 4px 16px; align-items: baseline;
  padding: 12px 0; border-bottom: 1px solid var(--border);
}
.source-row:last-child { border-bottom: 0; }
.source-row .s-name { font-weight: 600; }
.source-row .s-meta { color: var(--muted); font-size: 12.5px; }
.source-row .s-err { grid-column: 2 / -1; font: 12px/1.4 var(--mono); color: var(--ink-2); background: var(--surface-2); padding: 6px 8px; border-radius: 7px; overflow-wrap: anywhere; }
.source-row .s-when { text-align: right; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
details.more { margin-top: 4px; }
details.more summary { cursor: pointer; color: var(--accent-ink); font-weight: 500; font-size: 13px; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  .grid-2, .grid-2.even { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
  .topbar { position: static; padding-top: calc(14px + env(safe-area-inset-top)); background: none; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .topbar h1 { font-size: 20px; }
  .tabbar {
    display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; position: fixed; inset: auto 0 0 0; z-index: 6;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); border-top: 1px solid var(--border);
    background: color-mix(in srgb, var(--page) 92%, transparent);
    backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px);
  }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0; border-radius: 10px; color: var(--muted); font-size: 11px; font-weight: 500; }
  .tabbar a:hover { text-decoration: none; }
  .tabbar a[aria-current="page"] { color: var(--accent-ink); }
  .tabbar svg { width: 22px; height: 22px; }
  .card { padding: 16px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi .k-value { font-size: 22px; }
  .hide-md { display: none; }
  .field input[type="search"] { width: 150px; }
  .source-row { grid-template-columns: minmax(0, 1fr) auto; }
  .source-row .s-status { grid-column: 1 / -1; }
  .source-row .s-err { grid-column: 1 / -1; }
}
@media (max-width: 520px) {
  .hide-sm { display: none; }
  .seg button { padding: 5px 9px; }
  .topbar-tools { width: 100%; }

        for (let i = 0; i < s.t.length; i++) { const a = (s.t[i] - w.pub) / 1440; if (a >= 0 && a <= ageDays) pts.push([a, s.v[i]]); }
      } else pts = windowPoints(s, win);

      let edges;

        edges = [];

        for (let m = w.pub; m <= lim; m += unit) edges.push(m);

      for (let i = 0; i < edges.length - 1; i++) {
        const a = edges[i], b = edges[i + 1];

  }) : card('Share of works vs. share', null, h('div', {class: 'empty', text: 'Nothing meets these filters.'}));
  const flows = M.flows || {};
  const moves = ((flows.byTag || {})[mk.dim] || []).filter(v => match(v))
    .map(v => ({label: shortName(v.value), value: isK ? v.deltaKudos : v.deltaHits, sub: isK ? `${signed(v.deltaHits)} hits` : `${signed(v.deltaKudos)} kudos`}))
    .filter(v => v.value > 0).sort((a, b) => b.value - a.value);
  const flowWhen = flows.from && flows.to ? `${fDateTime(isoWall(flows.from))} – ${fDateTime(isoWall(flows.to))}` : 'Between the last two scans';
  el.append(h('div', {class: 'grid-2'}, scatterCard,
    card(`Biggest ${mLabel} gains`, flowWhen, rankList(moves, {limit: 10, emptyText: 'No movement between the last two scans.'}))));

  const sortKey = mk.sort.key, dir = mk.sort.dir;
  const keyed = {name: v => shortName(v.value), n: v => v.n, wshare: v => v.workShare, share, med, perf, authors: v => v.uniqueAuthors};
  const rows = values.filter(match).sort((a, b) => {
    const fa = keyed[sortKey] || share, va = fa(a), vb = fa(b);
    return typeof va === 'string' ? dir * va.localeCompare(vb) : dir * ((va ?? -Infinity) - (vb ?? -Infinity));
  });
  const sortBy = key => { mk.sort = {key, dir: sortKey === key ? -dir : key === 'name' ? 1 : -1}; saveMk(); };
  const th = (key, label, cls) => h('th', {class: 'sortable ' + (cls || ''), scope: 'col', tabindex: '0', 'data-k': 'mks:' + key,
    'aria-sort': sortKey === key ? (dir > 0 ? 'ascending' : 'descending') : null,
    onclick: () => sortBy(key), onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); sortBy(key); } }},
    label + (sortKey === key ? (dir > 0 ? ' ↑' : ' ↓') : ''));
  el.append(card(`All ${(DIM_LABELS[mk.dim] || dim.label).toLowerCase()}`, `${fmt(rows.length)} shown of ${fmt(dim.total_distinct)} distinct · ${dim.metricStatus === 'descriptive_unadjusted' ? 'descriptive, not adjusted for age or length' : ''}`,
    h('div', {class: 'table-scroll'}, h('table', {class: 'data'},
      h('thead', null, h('tr', null, th('name', 'Name'), th('n', 'Works'), th('wshare', 'Share of works', 'hide-sm'), th('share', `Share of ${mLabel}`),
        th('med', `Median ${mLabel}`, 'hide-sm'), th('perf', 'vs. share'), th('authors', 'Authors', 'hide-md'))),
      h('tbody', null, rows.slice(0, mk.limit).map(v => h('tr', null,
        h('td', null, h('span', {class: 't-title', text: shortName(v.value), title: v.value})),
        h('td', null, fmt(v.n)), h('td', {class: 'hide-sm'}, pct(v.workShare, 2)), h('td', null, pct(share(v), 2)),
        h('td', {class: 'hide-sm'}, fmt(med(v))), h('td', null, indexText(perf(v))), h('td', {class: 'hide-md'}, fmt(v.uniqueAuthors))))))),
    rows.length > mk.limit ? h('div', {class: 'pager'}, h('span', {text: `Showing ${fmt(mk.limit)} of ${fmt(rows.length)}`}),
      h('button', {type: 'button', class: 'btn', 'data-k': 'mkmore', onclick: () => { mk.limit += 50; render(); }}, 'Show more')) : null));

  const inv = M.inventory || {}, cov = (M.adultCoverage || {}).ratings || {};
  el.append(card('Scope & coverage', null,
    h('p', {class: 'note', style: 'margin-top:0'}, `${fmt(inv.competitorWorks)} General and Teen works analysed in detail (your own ${fmt(inv.selfExcluded)} excluded, ${fmt(inv.filterExcludedWorks)} crossovers filtered out). Mature, Explicit and Not Rated works are counted only in aggregate.`),
    Object.keys(cov).length ? h('details', {class: 'more'}, h('summary', null, 'Rating coverage'), h('div', {class: 'table-scroll'},
      simpleTable([{label: 'Rating'}, {label: 'Works'}, {label: 'Hits'}, {label: 'Kudos'}, {label: 'Detail'}],
        Object.entries(cov).map(([name, r]) => [name, fmt(r.works), fmtC(r.hits), fmtC(r.kudos), r.mode === 'aggregate_only' ? 'Aggregate only' : 'Detailed'])))) : null,
    corr.warning ? h('p', {class: 'note', text: `Correlations are ${corr.warning}.`}) : null));
}

function viewStatus(el) {
  const S = D.sources || {};
  head('Status', `Page built ${fDateTime(D.generatedAt)} · data through ${fDateTime(LAST)}`);
  const groups = [['feed', 'Scheduled feeds'], ['snapshot', 'One-off snapshots'], ['config', 'Configuration']];
  const row = src => {
    const when = isoWall(src.asOf);
    const cadence = src.kind === 'feed' && src.cadenceHours ? (src.cadenceHours <= 1.5 ? 'Every hour' : src.cadenceHours <= 13 ? `Every ${Math.round(src.cadenceHours)} hours` : 'Daily') : src.kind === 'snapshot' ? 'Manual' : 'Hand-maintained';
    return h('div', {class: 'source-row'},
      h('span', {class: 's-status'}, statusChip(src)),
      h('div', null, h('div', {class: 's-name', text: src.label}), h('div', {class: 's-meta', text: cadence + (src.lastAttemptAt && src.state === 'error' ? ` · last attempt ${fDateTime(isoWall(src.lastAttemptAt))}` : '')})),
      h('div', {class: 's-when'}, when ? fDateTime(when) : '—', h('div', {class: 's-meta', text: when ? ago(when) : ''})),
      src.error && src.state === 'error' ? h('div', {class: 's-err', text: src.error}) : null);
  };
  el.append(card('Data sources', 'What feeds this page, and when each last updated',
    groups.map(([kind, title]) => {
      const list = Object.values(S).filter(s => (s.kind || 'feed') === kind);
      return list.length ? [h('h3', {class: 'section-title', style: 'margin:14px 0 2px', text: title}), h('div', {class: 'sources'}, list.map(row))] : null;
    })));
  const C = D.collection || {};
  el.append(h('div', {class: 'kpis'},
    kpi({label: 'Observations collected', value: fmt(C.rows), deltaText: 'one row per work per pull'}),
    kpi({label: 'Works tracked', value: fmt(C.works)}),
    kpi({label: 'Tracking since', value: C.firstAt ? fDayY(C.firstAt) : '—'}),
    kpi({label: 'Latest pull', value: C.lastAt ? fDateTime(C.lastAt) : '—', deltaText: C.lastAt ? ago(C.lastAt) : ''})));

  const rows = [];
  for (const w of WORKS) {
    if (state.obsWork && w.id !== state.obsWork) continue;
    for (let i = 0; i < w.t.length; i++) rows.push({t: w.t[i], w, i});
  }
  rows.sort((a, b) => b.t - a.t || a.w.title.localeCompare(b.w.title));
  const per = 50, pages = Math.max(1, Math.ceil(rows.length / per));
  state.obsPage = Math.min(state.obsPage, pages - 1);
  const pageRows = rows.slice(state.obsPage * per, state.obsPage * per + per);
  const select = h('select', {'aria-label': 'Filter by work', 'data-k': 'obsw', onchange: e => { state.obsWork = e.target.value; state.obsPage = 0; render(); }},
    h('option', {value: '', text: 'All works'}), NEWEST.map(w => h('option', {value: w.id, text: w.title, selected: state.obsWork === w.id ? true : null})));
  el.append(card('Observations', 'Hourly for the last 35 days, one per day before that',
    h('div', {class: 'toolbar', style: 'margin-bottom:10px'}, h('label', {class: 'field'}, select),
      h('button', {type: 'button', class: 'btn', onclick: downloadCsv}, icon('download'), 'Download CSV')),
    h('div', {class: 'table-scroll'}, simpleTable([{label: 'Time (Eastern)'}, {label: 'Work', cls: 'left'}, ...METRICS.map(m => ({label: m.label, cls: m.key === 'hits' || m.key === 'kudos' ? '' : 'hide-sm'}))],
      pageRows.map(r => [fDateTime(r.t), h('span', {class: 't-title', text: r.w.title}), ...METRICS.map(m => fmt((r.w.v[m.key] || [])[r.i]))]))),
    h('div', {class: 'pager'},
      h('button', {type: 'button', class: 'btn', disabled: state.obsPage === 0 ? true : null, 'data-k': 'obsprev', onclick: () => { state.obsPage--; render(); }}, 'Newer'),
      h('span', {text: `Page ${state.obsPage + 1} of ${pages} · ${fmt(rows.length)} rows`}),
      h('button', {type: 'button', class: 'btn', disabled: state.obsPage >= pages - 1 ? true : null, 'data-k': 'obsnext', onclick: () => { state.obsPage++; render(); }}, 'Older'))));
}
function downloadCsv() {
  const esc = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const iso = m => toDate(m).toISOString().slice(0, 16).replace('T', ' ');
  const lines = [['time_eastern', 'work_id', 'title', ...METRICS.map(m => m.key)].join(',')];
  for (const w of WORKS) for (let i = 0; i < w.t.length; i++)
    lines.push([iso(w.t[i]), w.id, esc(w.title), ...METRICS.map(m => (w.v[m.key] || [])[i] ?? '')].join(','));
  const url = URL.createObjectURL(new Blob([lines.join('\n') + '\n'], {type: 'text/csv'}));
  const a = h('a', {href: url, download: `ao3-stats-${iso(LAST).slice(0, 10)}.csv`});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ======================================================================
   Shell: navigation, routing, banner, theme, refresh
   ====================================================================== */
const NAV = [
  {id: 'overview', label: 'Overview'}, {id: 'works', label: 'Works'}, {id: 'compare', label: 'Compare'},
  {id: 'market', label: 'Market'}, {id: 'status', label: 'Status'}];
const VIEWS = {overview: viewOverview, works: viewWorks, work: viewWork, compare: viewCompare, market: viewMarket, status: viewStatus};
function route() {
  const parts = (location.hash || '').replace(/^#\/?/, '').split('/');
  const view = VIEWS[parts[0]] ? parts[0] : 'overview';
  return {view, arg: parts[1] ? decodeURIComponent(parts[1]) : null};
}
function head(title, sub, tools) {
  document.getElementById('view-title').textContent = title;
  document.getElementById('view-sub').textContent = sub || '';
  document.getElementById('topbar-tools').replaceChildren(...(tools || []));
  document.title = title === 'Overview' ? 'Pridento Stats' : `${title} · Pridento Stats`;
}
function buildNav() {
  const {view} = route();
  const current = view === 'work' ? 'works' : view;
  const link = n => h('a', {href: '#/' + n.id, 'aria-current': n.id === current ? 'page' : null}, icon(n.id), h('span', {text: n.label}));
  document.getElementById('nav').replaceChildren(...NAV.map(link));
  document.getElementById('tabbar').replaceChildren(...NAV.map(link));
}
function buildBanner() {
  const s = (D.sources || {}).stats;
  const el = document.getElementById('banner');
  el.replaceChildren();
  if (!s || s.state === 'fresh' || route().view === 'status') return;
  const when = isoWall(s.asOf);
  el.append(h('div', {class: 'banner', role: 'status'},
    statusChip(s),
    h('div', {class: 'b-text'},
      h('b', {text: s.state === 'error' ? 'AO3 stats are paused' : 'AO3 stats are behind'}),
      h('span', {text: `Numbers are as of ${when ? fDateTime(when) + ' (' + ago(when) + ')' : 'the last good pull'}.` + (s.error ? ` Latest attempt failed: ${errorGist(s.error)}.` : '')})),
    h('a', {href: '#/status', text: 'Details'})));
}
function buildChrome() {
  const fr = document.getElementById('freshness');
  fr.replaceChildren(h('div', null, 'Data through ', h('b', {text: fDateTime(LAST)})), h('div', {text: `Built ${fDateTime(D.generatedAt)}`}));
  document.getElementById('foot').textContent = `All times Eastern. ${PRIVATE ? 'Private build: includes comments, subscriptions and notes.' : 'Public build.'}`;
}
const THEMES = ['system', 'light', 'dark'];
function applyTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  const btn = document.getElementById('theme-toggle');
  btn.replaceChildren(icon(t), h('span', {text: `Theme: ${t[0].toUpperCase() + t.slice(1)}`}));
  btn.onclick = () => { const next = THEMES[(THEMES.indexOf(t) + 1) % THEMES.length]; store.set('theme', next); applyTheme(next); };
}

let lastView = null;
function render() {
  const focusKey = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  const selStart = document.activeElement && document.activeElement.selectionStart;
  OBSERVERS.forEach(o => o.disconnect());
  OBSERVERS = [];
  hideTip();
  const {view, arg} = route();
  const el = document.getElementById('view');
  el.replaceChildren();
  buildNav();
  VIEWS[view](el, arg);
  buildBanner();
  const viewKey = view + ':' + (arg || '');
  if (viewKey !== lastView) { if (lastView !== null) scrollTo(0, 0); lastView = viewKey; }
  if (focusKey) {
    const again = document.querySelector(`[data-k="${CSS.escape(focusKey)}"]`);
    if (again) { again.focus({preventScroll: true}); if (selStart != null && again.setSelectionRange) try { again.setSelectionRange(selStart, selStart); } catch (e) { /* not a text field */ } }
  }
}

// The collector pulls on the hour; reload a few minutes later to pick up the new build.
function scheduleRefresh() {
  const now = new Date(), next = new Date(now);
  next.setMinutes(63, 0, 0);
  if (next - now > 3600000) next.setTime(next.getTime() - 3600000);
  if (next <= now) next.setTime(next.getTime() + 3600000);
  const due = next.getTime();
  const tick = () => { if (document.visibilityState === 'visible') location.reload(); };
  setTimeout(tick, due - now.getTime());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() >= due) location.reload(); });
}

applyTheme(store.get('theme', 'system'));
buildChrome();
addEventListener('hashchange', render);
render();
if (location.protocol !== 'file:' || PRIVATE) scheduleRefresh();
})();
</script>
